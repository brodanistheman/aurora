<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/aurora/users/profile/">
    <title>Aurora</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <main class="dashboard-container">
        <h1>User Profile</h1>
        <div id="profile-content" aria-live="polite">Loading profile...</div>

        <div id="upload-section" class="upload-section hidden">
            <h3>Update Profile Picture</h3>
            <label for="profile-pic-input">Choose an image</label>
            <input type="file" id="profile-pic-input" accept="image/png, image/jpeg">
            <div id="upload-preview" class="upload-preview hidden">
                <img id="upload-preview-img" alt="Selected profile picture preview">
            </div>
            <div id="upload-status" class="upload-status" aria-live="polite"></div>
            <button id="upload-pic-button" type="button">Upload Image</button>
        </div>

        <div class="button-group upload-actions">
            <button id="back-button" type="button">Back</button>
        </div>
    </main>

    <script type="module" src="../profile.js"></script>
</body>
</html>
