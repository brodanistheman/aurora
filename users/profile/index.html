<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/aurora/users/profile/">
    <title>Aurora</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>User Profile</h1>
        <div id="profile-content">Loading profile...</div>
        
        <div id="upload-section" style="display: none; margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
            <h3>Update Profile Picture</h3>
            <input type="file" id="profile-pic-input" accept="image/png, image/jpeg" style="margin-bottom: 10px;">
            <button id="upload-pic-button" type="button">Upload Image</button>
        </div>

        <div class="button-group" style="margin-top: 16px;">
            <button onclick="window.history.back()">Back</button>
        </div>
    </div>

    <script type="module" src="../profile.js"></script>
</body>
</html>
