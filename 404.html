<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora</title>
    <script type="text/javascript">
        var segmentCount = 1;
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        
        if (parts.length >= 4 && parts[1] === 'users' && parts[3] === 'profile') {
            var userId = parts[2];
            l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + parts[0] + '/users/profile/?id=' + userId + l.hash);
        } else {
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
                l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
                l.hash
            );
        }
    </script>
</head>
<body>
</body>
</html>
