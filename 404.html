<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aurora</title>
</head>
<body>
    <script type="text/javascript">
        (async function() {
            var l = window.location;
            var parts = l.pathname.split('/').filter(Boolean);
            
            if (parts.length >= 3 && parts[1] === 'users' && l.pathname.endsWith('/profile/')) {
                var userId = parts[2];
                
                try {
                    var response = await fetch('/aurora/users/profile/');
                    if (response.ok) {
                        var html = await response.text();
                        document.open();
                        document.write(html);
                        document.close();
                        window.__AURORA_USER_ID__ = userId;
                        return;
                    }
                } catch (e) {
                    console.error("Routing error", e);
                }
            }
            
            var segmentCount = 1;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
                l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
                l.hash
            );
        })();
    </script>
</body>
</html>
