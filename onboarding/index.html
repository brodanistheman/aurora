<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="container">
        <h1>Site Is Currently Being Remade</h1>

        <p class="description">
            We're making some changes. The site will be back soon.
        </p>

        <div class="downtime">
            <span>Time Since Maintenance Started</span>
            <strong id="downtime">00:00:00:00</strong>
        </div>

        <p class="notice">
            You'll Have To Sign Up Again After Maintenance.
        </p>

        <section class="drawing-section">
            <div class="drawing-header">
                <span>Drawing Canvas</span>

                <button type="button" id="clearCanvas">Clear</button>
            </div>

            <canvas id="drawingCanvas"></canvas>
        </section>
    </main>

    <script>
        const maintenanceStart = new Date("2026-11-20T03:53:00").getTime();

        function updateDowntime() {
            const elapsed = Math.max(0, Date.now() - maintenanceStart);

            const days = Math.floor(elapsed / 86400000);
            const hours = Math.floor(elapsed / 3600000) % 24;
            const minutes = Math.floor(elapsed / 60000) % 60;
            const seconds = Math.floor(elapsed / 1000) % 60;

            document.getElementById("downtime").textContent =
                `${String(days).padStart(2, "0")}:${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        updateDowntime();
        setInterval(updateDowntime, 1000);

        const canvas = document.getElementById("drawingCanvas");
        const context = canvas.getContext("2d");
        const clearButton = document.getElementById("clearCanvas");

        const storageKey = "maintenanceDrawing";

        let drawing = false;
        let lastX = 0;
        let lastY = 0;

        function resizeCanvas() {
            const savedDrawing = localStorage.getItem(storageKey);
            const previousWidth = canvas.width;
            const previousHeight = canvas.height;

            const image = savedDrawing ? new Image() : null;

            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;

            context.setTransform(
                window.devicePixelRatio,
                0,
                0,
                window.devicePixelRatio,
                0,
                0
            );

            context.lineWidth = 2;
            context.lineCap = "round";
            context.lineJoin = "round";
            context.strokeStyle = "#ffffff";

            if (image) {
                image.onload = () => {
                    context.drawImage(
                        image,
                        0,
                        0,
                        canvas.clientWidth,
                        canvas.clientHeight
                    );
                };

                image.src = savedDrawing;
            }
        }

        function saveDrawing() {
            try {
                localStorage.setItem(storageKey, canvas.toDataURL("image/png"));
            } catch (error) {
                console.warn("Unable to save drawing.");
            }
        }

        function getPosition(event) {
            const rect = canvas.getBoundingClientRect();

            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        function startDrawing(event) {
            event.preventDefault();

            drawing = true;

            const position = getPosition(event);

            lastX = position.x;
            lastY = position.y;

            canvas.setPointerCapture(event.pointerId);

            context.beginPath();
            context.moveTo(lastX, lastY);
        }

        function draw(event) {
            if (!drawing) return;

            event.preventDefault();

            const position = getPosition(event);

            context.beginPath();
            context.moveTo(lastX, lastY);
            context.lineTo(position.x, position.y);
            context.stroke();

            lastX = position.x;
            lastY = position.y;
        }

        function stopDrawing() {
            if (!drawing) return;

            drawing = false;
            saveDrawing();
        }

        canvas.addEventListener("pointerdown", startDrawing);
        canvas.addEventListener("pointermove", draw);
        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("lostpointercapture", stopDrawing);

        clearButton.addEventListener("click", () => {
            context.clearRect(0, 0, canvas.width, canvas.height);
            localStorage.removeItem(storageKey);
        });

        let resizeTimeout;

        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(resizeCanvas, 150);
        });

        resizeCanvas();
    </script>
</body>
</html>
