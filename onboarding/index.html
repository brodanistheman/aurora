<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="login-container">
        <h2>Aurora</h2>
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active" type="button">Log In</button>
            <button id="tab-signup" class="tab-btn" type="button">Sign Up</button>
        </div>

        <form id="login-form">
            <input type="email" id="identity-input" placeholder="Email..." autocomplete="off" required>
            <input type="password" id="password-input" placeholder="Password..." autocomplete="off" required>
            <button type="submit" id="submit-btn">Log In</button>
        </form>
    </div>

    <script type="module" src="onboarding.js"></script>
</body>
</html>
