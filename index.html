<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="Page">
        <div class="AuthContainer">
            <div class="Logo">Aurora</div>

            <div class="AuthHeader">
                <h1 id="AuthTitle">Sign In</h1>
                <p id="AuthDescription">Welcome Back</p>
            </div>

            <div class="AuthTabs">
                <button class="AuthTab Active" id="SignInTab" type="button">
                    Sign In
                </button>

                <button class="AuthTab" id="SignUpTab" type="button">
                    Sign Up
                </button>
            </div>

            <form id="SignInForm" class="AuthForm">
                <div class="Field">
                    <label for="SignInEmail">Email</label>
                    <input
                        id="SignInEmail"
                        type="email"
                        placeholder="Enter Your Email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignInPassword">Password</label>
                    <input
                        id="SignInPassword"
                        type="password"
                        placeholder="Enter Your Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="SubmitButton" type="submit">
                    Sign In
                </button>
            </form>

            <form id="SignUpForm" class="AuthForm Hidden">
                <div class="Field">
                    <label for="SignUpUsername">Username</label>
                    <input
                        id="SignUpUsername"
                        type="text"
                        placeholder="Choose A Username"
                        autocomplete="username"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignUpEmail">Email</label>
                    <input
                        id="SignUpEmail"
                        type="email"
                        placeholder="Enter Your Email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignUpPassword">Password</label>
                    <input
                        id="SignUpPassword"
                        type="password"
                        placeholder="Create A Password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button class="SubmitButton" type="submit">
                    Create Account
                </button>
            </form>

            <div class="AuthFooter">
                <span id="AuthFooterText">Don't Have An Account?</span>
                <button id="FooterToggle" type="button">Sign Up</button>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
