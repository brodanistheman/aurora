<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>optic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>optic</h2>
        <form id="login-form">
            <input type="email" id="email-input" placeholder="Enter your email..." autocomplete="off" required>
            <input type="password" id="password-input" placeholder="Enter your password..." autocomplete="off" required>
            <button type="submit" id="login-btn">Login / Sign Up</button>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
