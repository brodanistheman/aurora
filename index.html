<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>optic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h1>Welcome to <span class="highlight">optic</span></h1>
        <p class="tagline">Connect and chat instantly.</p>
        
        <form id="login-form">
            <input type="text" id="username-input" placeholder="Choose a username..." required autocomplete="off">
            <button type="submit" class="btn">Join Chat</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
