<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLKCCpNbCs2AJm7g0JtGIjL43X5hr31N8",
            authDomain: "aurora-9e0fe.firebaseapp.com",
            projectId: "aurora-9e0fe",
            storageBucket: "aurora-9e0fe.firebasestorage.app",
            messagingSenderId: "1023486645506",
            appId: "1:1023486645506:web:c64a98ebf0c3c817e01e1b",
            measurementId: "G-3XVQTC189X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'onboarding/';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const customPath = urlParams.get('p');

            if (customPath) {
                // Let settings paths pass through to the physical directory
                if (customPath.startsWith('/settings')) {
                    return;
                }

                const match = customPath.match(/^\/users\/([^\/]+)\/profile$/);
                if (match) {
                    const userId = match[1];
                    loadProfileView(userId);
                    return;
                }
            }

            window.location.href = 'general/';
        });

        function loadProfileView(userId) {
            document.body.innerHTML = `
                <div style="background:#121212; color:#fff; padding:40px; font-family:sans-serif;">
                    <h2>User Profile: ${userId}</h2>
                    <p>Loading profile data from Firestore...</p>
                    <a href="general/" style="color:#fff;">Back to General Chat</a>
                </div>
            `;
        }
    </script>
</body>
</html>
