<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Aurora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/script.js"></script>
</head>
<body>
    <main class="Page">
        <section class="AuthContainer" hidden>
            <div class="AuthModal">

                <div id="SignInView" class="AuthView">
                    <div class="AuthHeading">
                        <h1>Sign In</h1>
                        <p>Welcome Back To Aurora.</p>
                    </div>

                    <form id="SignInForm" class="AuthForm">
                        <label for="SignInEmail">Email Address</label>
                        <input
                            id="SignInEmail"
                            type="email"
                            placeholder="Enter Your Email"
                            autocomplete="email"
                            required
                        >

                        <label for="SignInPassword">Password</label>
                        <input
                            id="SignInPassword"
                            type="password"
                            placeholder="Enter Your Password"
                            autocomplete="current-password"
                            required
                        >

                        <p id="SignInMessage" class="Message" aria-live="polite"></p>

                        <button id="SignInButton" type="submit">
                            Sign In
                        </button>
                    </form>

                    <p class="AuthSwitch">
                        Don't Have An Account?
                        <button type="button" id="ShowSignUp">Sign Up</button>
                    </p>
                </div>

                <div id="SignUpView" class="AuthView" hidden>
                    <div class="AuthHeading">
                        <h1>Create An Account</h1>
                        <p>Join Aurora.</p>
                    </div>

                    <form id="SignUpForm" class="AuthForm">
                        <label for="SignUpUsername">Username</label>
                        <input
                            id="SignUpUsername"
                            type="text"
                            placeholder="Enter A Username"
                            minlength="3"
                            maxlength="20"
                            autocomplete="username"
                            required
                        >

                        <label for="SignUpDisplayName">Display Name</label>
                        <input
                            id="SignUpDisplayName"
                            type="text"
                            placeholder="Enter A Display Name"
                            maxlength="32"
                            required
                        >

                        <label for="SignUpEmail">Email Address</label>
                        <input
                            id="SignUpEmail"
                            type="email"
                            placeholder="Enter Your Email"
                            autocomplete="email"
                            required
                        >

                        <label for="SignUpPassword">Password</label>
                        <input
                            id="SignUpPassword"
                            type="password"
                            placeholder="Create A Password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <label for="ConfirmPassword">Confirm Password</label>
                        <input
                            id="ConfirmPassword"
                            type="password"
                            placeholder="Confirm Your Password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <p id="SignUpMessage" class="Message" aria-live="polite"></p>

                        <button id="SignUpButton" type="submit">
                            Create Account
                        </button>
                    </form>

                    <p class="AuthSwitch">
                        Already Have An Account?
                        <button type="button" id="ShowSignIn">Sign In</button>
                    </p>
                </div>

                <div id="AuthenticatedView" class="AuthView" hidden>
                    <div class="AuthHeading">
                        <h1>Welcome To Aurora</h1>
                        <p id="AuthenticatedMessage"></p>
                    </div>

                    <div class="ProfileSection">
                        <div class="ProfileHeading">
                            <h2>Profile Settings</h2>
                            <p>Customize Your Aurora Profile.</p>
                        </div>

                        <form id="ProfileForm" class="AuthForm">
                            <label for="ProfileUsername">Username</label>
                            <input
                                id="ProfileUsername"
                                type="text"
                                minlength="3"
                                maxlength="20"
                                autocomplete="username"
                                required
                            >

                            <label for="ProfileDisplayName">Display Name</label>
                            <input
                                id="ProfileDisplayName"
                                type="text"
                                maxlength="32"
                                required
                            >

                            <label for="ProfileAvatarFile">Avatar</label>

                            <div class="AvatarUpload">
                                <img
                                    id="ProfileAvatarPreview"
                                    class="AvatarPreview"
                                    alt="Avatar Preview"
                                    hidden
                                >

                                <input
                                    id="ProfileAvatarFile"
                                    type="file"
                                    accept="image/png,image/jpeg,image/webp,image/gif"
                                >

                                <p class="AvatarDescription">
                                    PNG, JPG, WebP, Or GIF. Maximum Size: 5 MB.
                                </p>
                            </div>

                            <p id="ProfileMessage" class="Message" aria-live="polite"></p>

                            <button id="SaveProfileButton" type="submit">
                                Save Changes
                            </button>
                        </form>
                    </div>

                    <button id="SignOutButton" type="button">
                        Sign Out
                    </button>
                </div>

            </div>
        </section>
    </main>

    <div id="AvatarCropModal" class="AvatarCropModal" hidden>
        <div class="AvatarCropDialog" role="dialog" aria-modal="true" aria-labelledby="AvatarCropTitle">
            <div class="AvatarCropHeader">
                <div>
                    <h2 id="AvatarCropTitle">Reposition Avatar</h2>
                    <p>Drag To Adjust The Image.</p>
                </div>

                <button class="AvatarCropClose" type="button" aria-label="Close">×</button>
            </div>

            <div class="AvatarCropViewport">
                <img class="AvatarCropImage" alt="">
            </div>

            <div class="AvatarCropControls">
                <label for="AvatarCropZoom">Zoom</label>
                <input id="AvatarCropZoom" type="range" min="1" max="3" step="0.01" value="1">
            </div>

            <div class="AvatarCropActions">
                <button class="AvatarCropCancel" type="button">Cancel</button>
                <button class="AvatarCropSave" type="button">Use Avatar</button>
            </div>
        </div>
    </div>
</body>
</html>
