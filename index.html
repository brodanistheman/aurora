<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="Page">
        <div class="Modal">
            <div class="ModalHeader">
                <h1 id="AuthTitle">Sign In</h1>
                <p id="AuthDescription">Enter Your Account Details</p>
            </div>

            <form id="SignInForm" class="AuthForm">
                <div class="Field">
                    <label for="SignInEmail">Email</label>
                    <input
                        id="SignInEmail"
                        type="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignInPassword">Password</label>
                    <input
                        id="SignInPassword"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="SubmitButton" type="submit">
                    Sign In
                </button>
            </form>

            <form id="SignUpForm" class="AuthForm Hidden">
                <div class="Field">
                    <label for="SignUpUsername">Username</label>
                    <input
                        id="SignUpUsername"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        minlength="3"
                        maxlength="20"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignUpEmail">Email</label>
                    <input
                        id="SignUpEmail"
                        type="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="Field">
                    <label for="SignUpPassword">Password</label>
                    <input
                        id="SignUpPassword"
                        type="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button class="SubmitButton" type="submit">
                    Create Account
                </button>
            </form>

            <div id="AuthMessage" class="AuthMessage Hidden"></div>

            <div class="ModalFooter">
                <span id="AuthFooterText">Don't Have An Account?</span>
                <button id="AuthToggle" type="button">Sign Up</button>
            </div>
        </div>
    </main>

    <script type="module" src="js/script.js"></script>
</body>
</html>
