<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { loadAccount, resolveUidBySequentialId } from "./account-store.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLKCCpNbCs2AJm7g0JtGIjL43X5hr31N8",
            authDomain: "aurora-9e0fe.firebaseapp.com",
            projectId: "aurora-9e0fe",
            storageBucket: "aurora-9e0fe.firebasestorage.app",
            messagingSenderId: "1023486645506",
            appId: "1:1023486645506:web:c64a98ebf0c3c817e01e1b",
            measurementId: "G-3XVQTC189X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '/aurora/onboarding/';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const customPath = urlParams.get('p');

            if (customPath) {
                if (customPath.startsWith('/settings')) {
                    return;
                }

                const match = customPath.match(/^\/users\/([^\/]+)\/profile$/);
                if (match) {
                    loadProfileView(match[1]);
                    return;
                }
            }

            window.location.href = '/aurora/general/';
        });

        async function loadProfileView(sequentialId) {
            renderProfileShell(sequentialId, 'Loading profile…');

            const uid = await resolveUidBySequentialId(db, sequentialId);
            if (!uid) {
                renderProfileShell(sequentialId, 'This profile could not be found.');
                return;
            }

            const { data } = await loadAccount(db, uid, {
                onFresh: (fresh) => renderProfileDetails(sequentialId, fresh)
            });

            if (data) {
                renderProfileDetails(sequentialId, data);
            } else {
                renderProfileShell(sequentialId, 'This profile could not be found.');
            }
        }

        function renderProfileShell(sequentialId, statusText) {
            document.body.innerHTML = `
                <div style="background:#17171c; color:#fff; padding:40px; font-family:sans-serif;">
                    <h2>User Profile: ${escapeHtml(sequentialId)}</h2>
                    <p id="profile-status">${escapeHtml(statusText)}</p>
                    <a href="/aurora/general/" style="color:#fff;">Back to General Chat</a>
                </div>
            `;
        }

        function renderProfileDetails(sequentialId, userData) {
            document.body.innerHTML = `
                <div style="background:#17171c; color:#fff; padding:40px; font-family:sans-serif;">
                    <h2>User Profile: ${escapeHtml(sequentialId)}</h2>
                    <p>Display name: ${escapeHtml(userData.displayName || 'Anonymous')}</p>
                    <a href="/aurora/general/" style="color:#fff;">Back to General Chat</a>
                </div>
            `;
        }
    </script>
</body>
</html>
