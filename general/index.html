<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Calls</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="call-page-body">
    <div class="call-page-layout">

        <aside class="sidebar call-page-sidebar">
            <h1>Aurora</h1>

            <div id="user-info" aria-live="polite"></div>

            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="logout-button" type="button">Log Out</button>
            </div>

            <div class="active-users-card">
                <h3>Online</h3>
                <div id="online-users-list" aria-live="polite"></div>
            </div>

            <div id="call-panel" class="call-panel">
                <div class="call-panel-title">Group Call</div>

                <div id="call-status" class="call-status">
                    No active call
                </div>

                <button id="group-call-btn" type="button">
                    Start group call
                </button>
            </div>
        </aside>

        <main class="call-page-main">
            <div
                id="call-modal"
                class="call-modal"
                role="region"
                aria-label="Aurora group call"
            >
                <div class="call-window">

                    <header class="call-header">
                        <div class="call-header-left">
                            <div class="call-title">Aurora group call</div>
                            <div id="call-status-modal" class="call-status">
                                Waiting for participants
                            </div>
                        </div>

                        <div class="call-count">
                            <span id="call-count">0</span>
                            <span>in call</span>
                        </div>
                    </header>

                    <button
                        id="audio-unlock"
                        class="audio-unlock"
                        type="button"
                    >
                        Enable audio
                    </button>

                    <div
                        id="video-grid"
                        class="video-grid"
                        data-count="0"
                    >
                        <div
                            id="call-empty-state"
                            class="call-empty-state"
                        >
                            <div class="call-empty-title">
                                Ready to join?
                            </div>

                            <div class="call-empty-text">
                                Start or join the group call to appear here.
                            </div>
                        </div>
                    </div>

                    <footer class="call-controls">
                        <button
                            id="toggle-mic"
                            class="call-control"
                            type="button"
                            aria-label="Toggle microphone"
                        >
                            Mic
                        </button>

                        <button
                            id="toggle-camera"
                            class="call-control"
                            type="button"
                            aria-label="Toggle camera"
                        >
                            Camera
                        </button>

                        <button
                            id="hangup-call"
                            class="call-control hangup"
                            type="button"
                            aria-label="Leave call"
                        >
                            Leave
                        </button>
                    </footer>

                </div>
            </div>
        </main>

    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
