<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>Aurora</h1>
        <div id="user-info"></div>
        <div class="button-group">
            <button id="profile-button" type="button">Profile</button>
            <button id="settings-button" type="button">Settings</button>
            <button id="logout-button" type="button">Log Out</button>
        </div>
        <div class="chat-container">
            <div id="message-box" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;"></div>
            <input type="text" id="message-input" placeholder="Type a message..." />
            <button id="send-button" type="button">Send</button>
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
