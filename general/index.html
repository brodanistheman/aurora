
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora chat dashboard">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1 class="brand">Aurora</h1>

            <button id="logout-button" class="nav-item" type="button" aria-label="Log out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="nav-label">Log out</span>
            </button>

            <section class="users" aria-label="Active users">
                <h2 class="section-label">Active <span id="online-count"></span></h2>
                <div id="online-users-list" class="users-list" aria-live="polite"></div>
            </section>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <h2 class="chat-title">General</h2>
            </header>

            <div id="message-box" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <form id="message-form" class="composer">
                <button id="attach-button" type="button" class="icon-btn" aria-label="Attach image or video">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <input
                    type="file"
                    id="image-file-input"
                    accept="image/*,video/*"
                    class="hidden"
                    aria-hidden="true"
                >

                <input
                    type="text"
                    id="message-input"
                    placeholder="Message"
                    autocomplete="off"
                    aria-label="Message"
                >

                <button id="send-button" class="send-btn" type="submit">Send</button>
            </form>
        </main>
    </div>

    <div
        id="image-modal"
        class="image-modal hidden"
        role="dialog"
        aria-modal="true"
        aria-label="Image preview"
    >
        <div class="image-modal-content">
            <button
                id="image-modal-close"
                class="image-modal-close"
                type="button"
                aria-label="Close image preview"
            >&times;</button>

            <img id="image-modal-img" src="" alt="Enlarged view">
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
