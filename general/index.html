<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: sans-serif;
            background: #f4f4f9;
        }
        .dashboard-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 220px;
            max-width: 300px;
        }
        .chat-panel {
            flex: 3;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            background: #fff;
            height: calc(100vh - 40px);
            box-sizing: border-box;
        }
        #message-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-radius: 4px;
        }
        .chat-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-group input {
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .chat-input-group button {
            padding: 10px 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chat-message {
            background: #f1f1f1;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-word;
        }
        .chat-message span {
            font-weight: bold;
            color: #333;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .button-group button {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h1>Aurora</h1>
            <div id="user-info"></div>
            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="logout-button" type="button">Log Out</button>
            </div>
        </div>

        <div class="chat-panel">
            <div id="message-box"></div>
            <div class="chat-input-group">
                <input type="text" id="message-input" placeholder="Type a message..." />
                <button id="send-button" type="button">Send</button>
            </div>
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
