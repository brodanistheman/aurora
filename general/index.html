<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora chat dashboard">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h1>Aurora</h1>
            <div id="user-info" aria-live="polite"></div>
            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="spotify-button" class="spotify-btn" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
                        <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288"/>
                    </svg>
                    <span>Link Spotify</span>
                </button>
                <button id="logout-button" type="button">Log Out</button>
            </div>

            <div class="active-users-card">
                <h3>Active Users</h3>
                <div id="online-users-list" class="active-users-list" aria-live="polite"></div>
            </div>

            <div id="call-panel" class="call-panel">
                <div class="call-panel-status" aria-live="polite">
                    <span class="call-panel-dot"></span>
                    <span id="call-panel-status">No one is in a call</span>
                </div>
                <button id="group-call-btn" class="call-panel-btn" type="button">
                    <i class="fa-solid fa-video"></i>
                    <span id="group-call-label">Start group call</span>
                </button>
            </div>
        </div>

        <div class="chat-panel">
            <div id="message-box" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <form id="message-form" class="chat-input-group">
                <button id="attach-button" type="button" class="attach-button" aria-label="Attach image or video">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="image-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" aria-label="Message">
                <button id="send-button" type="submit">Send</button>
            </form>
        </div>
    </div>

    <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <div class="image-modal-content">
            <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="image-modal-img" src="" alt="Enlarged view">
        </div>
    </div>

    <div id="call-modal" class="call-modal hidden" role="dialog" aria-modal="false" aria-labelledby="call-title">
        <div class="call-window">
            <header class="call-header">
                <div class="call-heading">
                    <h2 id="call-title" class="call-title">
                        <span class="call-live-dot"></span>
                        Group call
                    </h2>
                    <p id="call-status" class="call-subtitle" aria-live="polite">Waiting for others to join</p>
                </div>
                <div class="call-count" title="People in the call">
                    <i class="fa-solid fa-user-group"></i>
                    <span id="call-count">1</span>
                </div>
            </header>

            <button id="audio-unlock" class="audio-unlock hidden" type="button">
                <i class="fa-solid fa-volume-high"></i>
                Sound is blocked. Click to turn it on
            </button>

            <div id="video-grid" class="video-grid" data-count="1"></div>

            <div id="stream-overlay" class="stream-overlay hidden" role="dialog" aria-modal="true" aria-label="Full screen stream">
                <div class="stream-overlay-header">
                    <button id="stream-overlay-back" class="stream-overlay-back" type="button">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </button>
                    <span id="stream-overlay-title" class="stream-overlay-title"></span>
                </div>
                <div class="stream-overlay-body">
                    <video id="stream-overlay-video" autoplay playsinline muted></video>
                </div>
            </div>

            <footer class="call-controls">
                <button id="mic-button" class="call-btn" type="button" aria-label="Mute microphone" aria-pressed="false">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button id="cam-button" class="call-btn" type="button" aria-label="Turn on camera" aria-pressed="true">
                    <i class="fa-solid fa-video-slash"></i>
                </button>
                <button id="screen-share-button" class="call-btn" type="button" aria-label="Share your screen" aria-pressed="false">
                    <i class="fa-solid fa-display"></i>
                </button>
                <button id="audio-share-button" class="call-btn" type="button" aria-label="Play device audio to others" aria-pressed="false">
                    <i class="fa-solid fa-music"></i>
                </button>
                <button id="hangup-button" class="call-btn leave" type="button">
                    <i class="fa-solid fa-phone-slash"></i>
                    <span>Leave</span>
                </button>
            </footer>
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
