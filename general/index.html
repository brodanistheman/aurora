<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora chat dashboard">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h1>Aurora</h1>
            <div id="user-info" aria-live="polite"></div>
            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="logout-button" type="button">Log Out</button>
            </div>

            <div class="active-users-card">
                <h3>Active Users</h3>
                <div id="online-users-list" class="active-users-list" aria-live="polite"></div>
            </div>
        </div>

        <div class="chat-panel">
            <div id="message-box" role="log" aria-live="polite" aria-label="Chat messages"></div>
            <form id="message-form" class="chat-input-group">
                <button id="attach-button" type="button" class="attach-button" aria-label="Attach image or video">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="image-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" aria-label="Message">
                <button id="send-button" type="submit">Send</button>
            </form>
        </div>
    </div>

    <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <div class="image-modal-content">
            <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="image-modal-img" src="" alt="Enlarged view">
        </div>
    </div>

    <div id="call-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Group Video Call">
        <div class="image-modal-content" style="background: #111; padding: 20px; border-radius: 8px; text-align: center; max-width: 800px; width: 100%;">
            <div id="video-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; justify-content: center; margin-bottom: 15px; max-height: 60vh; overflow-y: auto;">
                <div style="position: relative;">
                    <video id="local-video" autoplay muted playsinline style="width: 100%; height: 150px; background: #000; border-radius: 6px; object-fit: cover;"></video>
                    <span style="position: absolute; bottom: 5px; left: 5px; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 6px; font-size: 11px; border-radius: 4px;">You</span>
                </div>
            </div>
            <div id="call-status" style="color: #fff; margin-bottom: 15px;">In group call room...</div>
            <button id="hangup-button" style="background: #b00020; color: #fff; width: auto; padding: 8px 16px;">Leave Room</button>
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
