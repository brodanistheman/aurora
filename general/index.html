<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Aurora chat">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Aurora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="app" class="app">

        <aside id="sidebar" class="sidebar" aria-label="Sidebar">
            <div class="sidebar-brand">Aurora</div>

            <nav class="sidebar-nav" aria-label="Channels">
                <div class="nav-item is-active" aria-current="page">
                    <i class="fa-solid fa-hashtag" aria-hidden="true"></i>
                    <span>General</span>
                </div>
            </nav>

            <section class="sidebar-section" aria-label="Active users">
                <h2 class="section-title">
                    <span>Active</span>
                    <span id="online-count" class="section-count">1</span>
                </h2>
                <div id="online-users-list" class="user-list" aria-live="polite"></div>
            </section>

            <div class="sidebar-footer">
                <div class="me">
                    <div class="avatar-wrap" style="--size: 24px;">
                        <img id="current-user-avatar" alt="">
                        <span class="status-dot status-online" role="img" aria-label="Online"></span>
                    </div>
                    <div class="me-text">
                        <span id="current-user-name" class="me-name"></span>
                        <span id="user-info" class="me-info" aria-live="polite"></span>
                    </div>
                </div>

                <div class="footer-actions">
                    <button id="profile-button" class="icon-btn" type="button" title="Profile" aria-label="Profile">
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                    </button>
                    <button id="settings-button" class="icon-btn" type="button" title="Settings" aria-label="Settings">
                        <i class="fa-solid fa-gear" aria-hidden="true"></i>
                    </button>
                    <button id="logout-button" class="icon-btn" type="button" title="Log out" aria-label="Log out">
                        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </aside>

        <div id="sidebar-scrim" class="sidebar-scrim hidden"></div>

        <main class="chat">
            <header class="chat-header">
                <button id="sidebar-toggle" class="icon-btn sidebar-toggle" type="button" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
                    <i class="fa-solid fa-bars" aria-hidden="true"></i>
                </button>
                <h1 class="chat-title">
                    <i class="fa-solid fa-hashtag" aria-hidden="true"></i>
                    <span>general</span>
                </h1>
            </header>

            <div id="message-box" class="feed" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <form id="message-form" class="composer">
                <div class="composer-field">
                    <button id="attach-button" class="composer-btn" type="button" title="Attach image or video" aria-label="Attach image or video">
                        <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
                    </button>
                    <input type="file" id="image-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true" tabindex="-1">
                    <input type="text" id="message-input" class="composer-input" placeholder="Message #general" autocomplete="off" aria-label="Message">
                    <button id="emoji-button" class="composer-btn" type="button" title="Insert emoji" aria-label="Insert emoji">
                        <i class="fa-regular fa-face-smile" aria-hidden="true"></i>
                    </button>
                    <button id="send-button" class="send-btn" type="submit">Send</button>
                </div>
            </form>
        </main>

        <aside id="thread-panel" class="thread-panel hidden" aria-label="Thread">
            <header class="panel-header">
                <div class="panel-heading">
                    <h2 class="panel-title">Thread</h2>
                    <span class="panel-sub">#general</span>
                </div>
                <button id="thread-close" class="icon-btn" type="button" title="Close thread" aria-label="Close thread">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <div id="thread-box" class="feed thread-feed" aria-live="polite"></div>

            <form id="thread-form" class="composer">
                <div class="composer-field">
                    <button id="thread-attach-button" class="composer-btn" type="button" title="Attach image or video" aria-label="Attach image or video to reply">
                        <i class="fa-solid fa-paperclip" aria-hidden="true"></i>
                    </button>
                    <input type="file" id="thread-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true" tabindex="-1">
                    <input type="text" id="thread-input" class="composer-input" placeholder="Reply in thread" autocomplete="off" aria-label="Reply in thread">
                    <button id="thread-send-button" class="send-btn" type="submit">Reply</button>
                </div>
            </form>
        </aside>
    </div>

    <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image preview">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
        <img id="image-modal-img" src="" alt="Enlarged view">
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
