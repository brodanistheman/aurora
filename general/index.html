<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora chat dashboard">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../calls.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h1 class="brand">Aurora</h1>

            <nav class="nav" aria-label="Account">
                <button id="group-call-button" class="nav-item" type="button" aria-label="Start group call">
                    <i class="fa-solid fa-users"></i>
                    <span class="nav-label">Group call</span>
                </button>
                <button id="group-video-button" class="nav-item" type="button" aria-label="Start group video call">
                    <i class="fa-solid fa-video"></i>
                    <span class="nav-label">Group video</span>
                </button>
                <button id="profile-button" class="nav-item" type="button" aria-label="Profile">
                    <i class="fa-regular fa-user"></i>
                    <span class="nav-label">Profile</span>
                </button>
                <button id="settings-button" class="nav-item" type="button" aria-label="Settings">
                    <i class="fa-solid fa-gear"></i>
                    <span class="nav-label">Settings</span>
                </button>
                <button id="logout-button" class="nav-item" type="button" aria-label="Log out">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span class="nav-label">Log out</span>
                </button>
            </nav>

            <section class="users" aria-label="Active users">
                <h2 class="section-label">Active <span id="online-count"></span></h2>
                <div id="online-users-list" class="users-list" aria-live="polite"></div>
            </section>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <h2 class="chat-title">General</h2>
            </header>

            <!-- Inline call bar: sits in the page flow, not a modal -->
            <section id="call-bar" class="call-bar hidden" aria-label="Call" aria-live="polite">
                <div id="call-grid" class="call-grid hidden"></div>
                <div class="call-row">
                    <img id="call-avatar" class="call-avatar" alt="">
                    <div class="call-meta">
                        <span id="call-name" class="call-name"></span>
                        <span id="call-status" class="call-status"></span>
                    </div>
                    <div class="call-actions">
                        <button id="call-accept" class="call-btn call-accept hidden" type="button" title="Accept" aria-label="Accept call">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                        <button id="call-mute" class="call-btn hidden" type="button" title="Mute" aria-label="Mute" aria-pressed="false">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <button id="call-camera" class="call-btn hidden" type="button" title="Turn camera off" aria-label="Turn camera off" aria-pressed="false">
                            <i class="fa-solid fa-video"></i>
                        </button>
                        <button id="call-hangup" class="call-btn call-end" type="button" title="Leave call" aria-label="Leave call">
                            <i class="fa-solid fa-phone-slash"></i>
                        </button>
                    </div>
                </div>
            </section>

            <div id="message-box" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <form id="message-form" class="composer">
                <button id="attach-button" type="button" class="icon-btn" aria-label="Attach image or video">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="image-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true">
                <input type="text" id="message-input" placeholder="Message" autocomplete="off" aria-label="Message">
                <button id="send-button" class="send-btn" type="submit">Send</button>
            </form>
        </main>

        <aside id="thread-panel" class="thread hidden" aria-label="Thread">
            <header class="thread-header">
                <h2 class="thread-title">Thread</h2>
                <button id="thread-close" class="icon-btn" type="button" aria-label="Close thread">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <div id="thread-root" class="thread-root"></div>
            <div id="thread-count" class="thread-count">No replies</div>
            <div id="thread-box" class="thread-box" role="log" aria-live="polite" aria-label="Thread replies"></div>

            <form id="thread-form" class="composer">
                <input type="text" id="thread-input" placeholder="Reply" autocomplete="off" aria-label="Reply in thread">
                <button id="thread-send" class="send-btn" type="submit">Reply</button>
            </form>
        </aside>
    </div>

    <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <div class="image-modal-content">
            <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="image-modal-img" src="" alt="Enlarged view">
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
