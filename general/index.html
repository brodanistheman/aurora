<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aurora chat dashboard">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <h1>Aurora</h1>
            <div id="user-info" aria-live="polite"></div>
            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="logout-button" type="button">Log Out</button>
            </div>

            <div class="active-users-card">
                <h3>Active Users</h3>
                <div id="online-users-list" class="active-users-list" aria-live="polite"></div>
            </div>

            <div id="call-panel" class="call-panel">
                <div class="call-panel-status" aria-live="polite">
                    <span class="call-panel-dot"></span>
                    <span id="call-panel-status">No one is in a call</span>
                </div>
                <button id="group-call-btn" class="call-panel-btn" type="button">
                    <i class="fa-solid fa-video"></i>
                    <span id="group-call-label">Start group call</span>
                </button>
            </div>
        </div>

        <div class="chat-panel">
            <div id="message-box" role="log" aria-live="polite" aria-label="Chat messages"></div>

            <div id="reply-banner" class="reply-banner hidden">
                <div class="reply-banner-text">
                    <span class="reply-banner-label">Replying to <strong id="reply-banner-name"></strong></span>
                    <span id="reply-banner-snippet"></span>
                </div>
                <button id="reply-cancel" class="reply-banner-close" type="button" aria-label="Cancel reply">&times;</button>
            </div>

            <form id="message-form" class="chat-input-group">
                <button id="attach-button" type="button" class="attach-button" aria-label="Attach image or video">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="file" id="image-file-input" accept="image/*,video/*" class="hidden" aria-hidden="true">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" aria-label="Message">
                <button id="send-button" type="submit">Send</button>
            </form>
        </div>
    </div>

    <div id="image-modal" class="image-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <div class="image-modal-content">
            <button id="image-modal-close" class="image-modal-close" type="button" aria-label="Close image preview">&times;</button>
            <img id="image-modal-img" src="" alt="Enlarged view">
        </div>
    </div>

    <div id="call-modal" class="call-modal hidden" role="dialog" aria-modal="false" aria-labelledby="call-title">
        <div class="call-window">
            <header class="call-header">
                <div class="call-heading">
                    <h2 id="call-title" class="call-title">
                        <span class="call-live-dot"></span>
                        Group call
                    </h2>
                    <p id="call-status" class="call-subtitle" aria-live="polite">Waiting for others to join</p>
                </div>
                <div class="call-count" title="People in the call">
                    <i class="fa-solid fa-user-group"></i>
                    <span id="call-count">1</span>
                </div>
            </header>

            <button id="audio-unlock" class="audio-unlock hidden" type="button">
                <i class="fa-solid fa-volume-high"></i>
                Sound is blocked. Click to turn it on
            </button>

            <div id="video-grid" class="video-grid" data-count="1"></div>

            <footer class="call-controls">
                <button id="mic-button" class="call-btn" type="button" aria-label="Mute microphone" aria-pressed="false">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <button id="cam-button" class="call-btn" type="button" aria-label="Turn on camera" aria-pressed="true">
                    <i class="fa-solid fa-video-slash"></i>
                </button>
                <button id="hangup-button" class="call-btn leave" type="button">
                    <i class="fa-solid fa-phone-slash"></i>
                    <span>Leave</span>
                </button>
            </footer>
        </div>
    </div>

    <script type="module" src="general.js"></script>
</body>
</html>
