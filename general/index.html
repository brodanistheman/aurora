<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .falling-cupcake {
            position: absolute;
            top: -120px;
            object-fit: contain;
            transition: transform linear;
        }
    </style>
</head>
<body>

    <div class="rain-container" id="rain"></div>

    <div class="dashboard-layout">
        <div class="sidebar">
            <h1>Aurora</h1>
            <div id="user-info"></div>
            <div class="button-group">
                <button id="profile-button" type="button">Profile</button>
                <button id="settings-button" type="button">Settings</button>
                <button id="logout-button" type="button">Log Out</button>
            </div>
        </div>

        <div class="chat-panel">
            <div id="message-box"></div>
            <div class="chat-input-group">
                <input type="text" id="message-input" placeholder="Type a message..." />
                <button id="send-button" type="button">Send</button>
            </div>
        </div>
    </div>

    <script>
        const rainContainer = document.getElementById('rain');
        const imageUrl = 'https://static.vecteezy.com/system/resources/previews/048/387/248/non_2x/a-delicious-vanilla-cupcake-with-pink-frosting-and-sprinkles-isolated-on-a-transparent-background-free-png.png';
        
        function createCupcake() {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.classList.add('falling-cupcake');
            
            const randomX = Math.random() * window.innerWidth;
            img.style.left = randomX + 'px';
            
            const size = Math.random() * 40 + 50;
            img.style.width = size + 'px';

            const duration = Math.random() * 4 + 4; 
            img.style.transitionDuration = duration + 's';

            img.style.transform = 'translateY(0px) rotate(0deg)';

            rainContainer.appendChild(img);

            requestAnimationFrame(() => {
                setTimeout(() => {
                    const randomRotation = (Math.random() - 0.5) * 360;
                    img.style.transform = `translateY(${window.innerHeight + 150}px) rotate(${randomRotation}deg)`;
                }, 50);
            });

            setTimeout(() => {
                img.remove();
            }, duration * 1000);
        }

        function randomRain() {
            createCupcake();
            const randomInterval = Math.random() * 900 + 600;
            setTimeout(randomRain, randomInterval);
        }

        randomRain();
    </script>

    <script type="module" src="general.js"></script>
</body>
</html>
