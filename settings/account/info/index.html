<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Aurora</title>
    <link rel="stylesheet" href="/aurora/style.css">
</head>
<body>
    <div class="dashboard-container">
        <h1>Account Info</h1>
        <div id="user-info">Loading account details...</div>
        
        <form id="update-info-form" style="margin-top: 16px;">
            <input type="text" id="display-name-input" placeholder="Display Name..." autocomplete="off">
            <input type="text" id="username-input" placeholder="Username..." autocomplete="off">
            <button type="submit">Update Profile</button>
        </form>

        <div class="button-group" style="margin-top: 12px;">
            <button onclick="window.location.href='/aurora/settings/account/'">Back</button>
            <button id="logout-button">Log Out</button>
        </div>
    </div>

    <script type="module" src="/aurora/settings/settings.js"></script>
</body>
</html>
