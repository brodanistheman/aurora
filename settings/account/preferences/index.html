<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferences - Aurora</title>
    <link rel="stylesheet" href="/aurora/style.css">
    <script>
        const t = localStorage.getItem('aurora_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
    </script>
</head>
<body>
    <div class="dashboard-container">
        <h1>Preferences</h1>
        <p style="margin-bottom: 24px; font-size: 14px; color: var(--muted-text);">Customize how Aurora looks and feels.</p>

        <div class="theme-toggle-row">
            <span class="theme-toggle-label">Dark mode</span>
            <label class="theme-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="theme-switch-slider"></span>
            </label>
        </div>

        <div class="button-group" style="margin-top: 24px;">
            <button onclick="window.location.href='/aurora/settings/account/'">Back to Account</button>
        </div>
    </div>

    <script type="module" src="/aurora/settings/account/preferences/preferences.js"></script>
</body>
</html>
